<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papelaria Criativa | Design & Organização</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">PAPEL<span>ART</span></div>
            <nav>
                <a href="https://wa.me/5531987836850" class="btn-contato">Encomendar Kit</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="container hero-content">
            <div class="hero-text">
                <h1>Tudo o que você precisa para criar.</h1>
                <p>Papelaria fina, materiais para arte e organização personalizada para o seu dia a dia.</p>
                <a href="#produtos" class="btn-principal">Ver Coleções</a>
            </div>
            <div class="hero-image">
                <img src="https://images.pexels.com/photos/5416625/pexels-photo-5416625.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Papelaria de luxo">
            </div>
        </div>
    </section>

    <section id="produtos" class="categorias">
        <div class="container">
            <h2 class="section-title">Nossas Coleções</h2>
            <div class="grid-categorias">
                <div class="cat-card">
                    <img src="https://images.pexels.com/photos/5849559/pexels-photo-5849559.jpeg?auto=compress&cs=tinysrgb&w=400" alt="Planners">
                    <div class="overlay">
                        <h3>Planners & Agendas</h3>
                    </div>
                </div>
                <div class="cat-card">
                    <img src="https://images.pexels.com/photos/45718/pexels-photo-45718.jpeg?auto=compress&cs=tinysrgb&w=400" alt="Escrita">
                    <div class="overlay">
                        <h3>Escrita Premium</h3>
                    </div>
                </div>
                <div class="cat-card">
                    <img src="https://images.pexels.com/photos/6373305/pexels-photo-6373305.jpeg?auto=compress&cs=tinysrgb&w=400" alt="Arte">
                    <div class="overlay">
                        <h3>Material de Arte</h3>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>Desenvolvido por <strong>@devmelgaco</strong> | (31) 98783-6850</p>
    </footer>
</body>
</html>
